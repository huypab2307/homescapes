<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Homescapes · License Admin</title><style>body{background:#0b1221;color:#e5eefb;font:16px system-ui;max-width:1100px;margin:50px auto;padding:24px}section{background:#162237;padding:24px;border-radius:16px;margin:20px 0}input,select,button{padding:12px;margin:6px;background:#223654;color:white;border:1px solid #456180;border-radius:8px}button{cursor:pointer}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #38506c}#message{white-space:pre-wrap;overflow-wrap:anywhere;color:#ffda85}.scroll{overflow:auto}[hidden]{display:none!important}</style><h1>Homescapes · License Admin</h1><p>Tạo key, quản lý thời hạn và khóa thiết bị.</p><section id="login"><form id="loginForm"><input id="password" type="password" required autocomplete="current-password" placeholder="Mật khẩu Admin"><button>Đăng nhập</button></form></section><div id="panel" hidden><button id="logout">Đăng xuất</button><section><form id="createForm"><select id="days"><option value="7">7 ngày</option><option value="30">30 ngày</option><option value="365">365 ngày</option><option value="0">Vĩnh viễn</option></select><input id="note" maxlength="500" placeholder="Ghi chú khách hàng"><button>Tạo key</button></form><p>Thời hạn tính từ lúc tạo. Mỗi key dùng cho một máy.</p><pre id="newkey"></pre><button id="copy" hidden>Sao chép key</button></section><button id="refresh">Làm mới</button><section class="scroll"><table><thead><tr><th>Đuôi key</th><th>Ghi chú</th><th>Hết hạn</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody id="rows"></tbody></table></section></div><p id="message" role="status"></p><script src="/admin.js"></script></html>
