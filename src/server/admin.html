<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Homescapes · License Admin</title><style>body{background:#0b1221;color:#e5eefb;font:16px system-ui;max-width:1100px;margin:50px auto;padding:24px}section{background:#162237;padding:24px;border-radius:16px;margin:20px 0}input,select,button{padding:12px;margin:6px;background:#223654;color:white;border:1px solid #456180;border-radius:8px}button{cursor:pointer}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #38506c}#message{white-space:pre-wrap;overflow-wrap:anywhere;color:#ffda85}.scroll{overflow:auto}[hidden]{display:none!important}</style><h1>Homescapes · License Admin</h1><p>Create keys and manage validity and device assignments.</p><section id="login"><form id="loginForm"><input id="password" type="password" required autocomplete="current-password" placeholder="Admin password"><button>Sign in</button></form></section><div id="panel" hidden><button id="logout">Sign out</button><section><form id="createForm"><select id="days"><option value="7">7 days</option><option value="30">30 days</option><option value="365">365 days</option><option value="0">Lifetime</option></select><input id="maxDevices" type="number" min="1" max="100" value="1" required placeholder="Maximum devices"><input id="deviceIds" required placeholder="Device IDs separated by semicolons"><input id="note" maxlength="500" placeholder="Customer note"><button>Create key</button></form><p>Validity starts at creation. Keys work only on assigned Device IDs.</p><pre id="newkey"></pre><button id="copy" hidden>Copy key</button></section><button id="refresh">Refresh</button><section class="scroll"><table><thead><tr><th>Key suffix</th><th>Note</th><th>Expires</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></section></div><p id="message" role="status"></p><script src="/admin.js"></script></html>
